name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Prepare app icon
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet pillow
          curl -fsSL --retry 3 --max-time 120 -o icon-src.png "https://aka.doubaocdn.com/s/3zaNKsyx1P" || true
          if [ -s icon-src.png ]; then
            .venv/bin/python tools/prepare_icon.py icon-src.png MultiDown/Assets.xcassets/AppIcon.appiconset
          else
            echo "fallback to vector icon"
            .venv/bin/python tools/make_icon.py MultiDown/Assets.xcassets/AppIcon.appiconset
          fi
          ls -lh MultiDown/Assets.xcassets/AppIcon.appiconset

      - name: Show Xcode
        run: xcodebuild -version | tee -a build.log

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -list -project MultiDown.xcodeproj 2>&1 | tee -a build.log
          xcodebuild -project MultiDown.xcodeproj \
            -scheme MultiDown \
            -sdk iphoneos \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build 2>&1 | tee -a build.log

      - name: Collect error log on failure
        if: failure()
        run: |
          grep -n -i -E "error|warning: " build.log | head -n 200 > build-error.log || true
          echo "" >> build-error.log
          echo "---- tail ----" >> build-error.log
          tail -n 200 build.log >> build-error.log || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MultiDown.app Payload/
          zip -q -r MultiDown-unsigned.ipa Payload
          cp MultiDown/Assets.xcassets/AppIcon.appiconset/icon-1024.png app-icon.png
          ls -lh MultiDown-unsigned.ipa app-icon.png

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          for i in 1 2 3 4; do
            if gh release create "$TAG" MultiDown-unsigned.ipa app-icon.png --title "MultiDown $TAG" --notes "unsigned ipa"; then
              exit 0
            fi
            echo "release attempt $i failed, retrying..."
            sleep 15
          done
          exit 1

      - name: Upload error log to release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="log-${{ github.run_number }}"
          for i in 1 2 3; do
            if gh release create "$TAG" build-error.log --title "$TAG" --notes "build log"; then
              exit 0
            fi
            sleep 10
          done
