name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version | tee -a build.log

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -list -project MultiDown.xcodeproj 2>&1 | tee -a build.log
          xcodebuild -project MultiDown.xcodeproj \
            -scheme MultiDown \
            -sdk iphoneos \
            -configuration Release \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build 2>&1 | tee -a build.log

      - name: Diagnostics
        if: failure()
        run: |
          echo '### build.log tail' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MultiDown.app Payload/
          zip -q -r MultiDown-unsigned.ipa Payload
          ls -lh MultiDown-unsigned.ipa

      - name: Upload IPA to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MultiDown build-${{ github.run_number }}
          files: MultiDown-unsigned.ipa
